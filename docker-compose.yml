name: visor-conversaciones

services:
  backend:
    build: ./backend
    image: visor-conversaciones-backend
    env_file: ./backend/.env
    environment:
      PUERTO: 3001
      # En Docker el frontend lo sirve nginx, no el backend
      FRONTEND_DIST: ""
    init: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: visor-conversaciones-frontend
    environment:
      API_URL: http://backend:3001
    ports:
      - "${VISOR_PUERTO:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
